{{- if .Values.networkPolicy.enabled }}
# Only the API gateway and the payment provider may reach the HTTP port (the smoke test Pod of this release is admitted as
# well), and only the monitoring namespace may reach the metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "payments.fullname" . }}
  labels:
    {{- include "payments.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "payments.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayPodLabels | nindent 14 }}
        # The payment provider posts its signed webhooks to POST /v1/webhooks/payment-provider.
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.providerPodLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: smoke-test
      ports:
        - port: http
          protocol: TCP
    # Prometheus scrapes the metrics port; no other namespace may reach it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metrics.namespace | quote }}
      ports:
        - port: metrics
          protocol: TCP
{{- end }}
